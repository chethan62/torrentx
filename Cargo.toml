[package]
name = "torrentx"
version = "18.3.1"
edition = "2021"

[[bin]]
name = "torrentx"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.36", features = ["default"] }
egui = "0.36"
egui_extras = { version = "0.36", features = ["default", "svg"] }
reqwest = { version = "0.13", features = ["blocking", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
open = "5.1"
dirs-next = "2.0"
url = "2.5"
quick-xml = { version = "0.42", features = ["escape-html"] }
uuid = { version = "1", features = ["v4"] }
tray-icon = { version = "0.25", default-features = false, features = ["ksni"] }
notify-rust = "4.11"

[profile.release]
opt-level = 3
lto = true
strip = true
