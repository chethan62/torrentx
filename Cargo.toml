[package]
name = "torrentx"
version = "18.1.2"
edition = "2021"

[[bin]]
name = "torrentx"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.36", features = ["default"] }
egui = "0.36"
egui_extras = { version = "0.36", features = ["default", "svg"] }
reqwest = { version = "0.11", features = ["blocking", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
open = "5.1"
dirs-next = "2.0"
url = "2.5"
quick-xml = "0.31"
tray-icon = "0.19"
notify-rust = "4.11"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[profile.release]
opt-level = 3
lto = true
strip = true
