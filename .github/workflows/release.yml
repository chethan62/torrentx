name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    name: Linux binary + AppImage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps (egui/GTK/tray)
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libgtk-3-dev libasound2-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxcb1-dev libssl-dev pkg-config librsvg2-bin file

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-release-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build binary + AppImage
        env:
          TORRENTX_PROJECT_DIR: ${{ github.workspace }}
          TORRENTX_SKIP_WINDOWS: "1"
        run: python3 build_torrentx.py

      - name: Package raw binary + checksums
        run: |
          cd target/release
          tar czf ../../dist/torrentx-${GITHUB_REF_NAME}-x86_64-linux.tar.gz torrentx
          cd ../../dist
          sha256sum * > sha256sums.txt

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/*
