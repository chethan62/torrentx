name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets a run be (re)started from the API after a missed or dropped event.
  workflow_dispatch:

# Least privilege: this workflow only reads the repo.
permissions:
  contents: read

# A newer push supersedes an in-flight run for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test-clippy:
    name: build + test + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system deps (egui/winit)
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libasound2-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxcb1-dev libssl-dev pkg-config

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Keyed on the lockfile only: a version bump (every release) changes no
          # dependency, and hashing Cargo.toml turned each tag into a full cold
          # rebuild. restore-keys keeps a manifest-only change warm as well.
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --all-targets

      - name: UI standards
        run: ./scripts/ui-standards.sh

      - name: Test
        run: cargo test --all-targets

      - name: Clippy (warnings are errors)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Format check
        run: cargo fmt --all --check

      # Two spellings silently drop a state update when a mutex is poisoned
      # (18.6.7): `if let Ok(..) = X.lock()` and `.lock().map(..)`. Neither is
      # ever legitimate — tests only ever take a raw lock to poison one on
      # purpose. Grep, not a lint: no tooling, and it names the line.
      - name: Lock convention
        run: |
          hits=$(grep -rnE 'if let Ok\(.*\.lock\(\)|let Ok\(.*\.lock\(\)|\.lock\(\)\.map\(' src/ || true)
          if [ -n "$hits" ]; then
            echo "use crate::lock_or_recover() instead of a fallible lock:"; echo "$hits"; exit 1
          fi
          echo "lock-convention: ok"
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      # deny.toml is the policy: permissive licence allow-list, no wildcards or
      # git sources, and advisories blocking (4 unmaintained IDs are ignored
      # there with a reason, because no patched release exists).
      - name: Licences + advisories (cargo-deny)
        run: cargo deny --all-features check licenses advisories bans sources

  # The app advertises itself as cross-platform and build_torrentx.py carries a
  # Windows path, but nothing ever compiled it. This job builds the .exe so the
  # claim is checked instead of assumed (it is not shipped: untested on Windows).
  windows-build:
    name: windows cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: mingw toolchain + rust target
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 nasm cmake
          rustup target add x86_64-pc-windows-gnu

      - name: Cache cargo (windows target)
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/x86_64-pc-windows-gnu
          key: ${{ runner.os }}-win-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-win-cargo-

      - name: Build the Windows binary
        run: cargo build --target x86_64-pc-windows-gnu

      - name: Assert the .exe exists
        run: test -s target/x86_64-pc-windows-gnu/debug/torrentx.exe

