name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets a run be (re)started from the API after a missed or dropped event.
  workflow_dispatch:

# Least privilege: this workflow only reads the repo.
permissions:
  contents: read

# PRs supersede their own in-flight run (an older attempt is irrelevant once a
# newer commit lands). Pushes to main do NOT: cancelling them left commits on
# main that never got a verdict at all — f1f21de shipped a clippy failure that
# only surfaced when the cancelled run was re-run by hand.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test-clippy:
    name: build + test + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system deps (egui/winit)
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libasound2-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxcb1-dev libssl-dev pkg-config

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Keyed on the lockfile only: a version bump (every release) changes no
          # dependency, and hashing Cargo.toml turned each tag into a full cold
          # rebuild. restore-keys keeps a manifest-only change warm as well.
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --all-targets

      # Doc-only commits must arrive through a PR (CONTRIBUTING.md). Runs first:
      # it is seconds of API calls, and a doc push that skipped review should fail
      # before the toolchain spends two minutes on a build.
      - name: Doc changes came through a PR
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMMITS: ${{ join(github.event.commits.*.id, ' ') }}
        run: python3 scripts/doc-pr-guard.py

      - name: UI standards
        run: ./scripts/ui-standards.sh

      - name: Test
        run: cargo test --all-targets

      - name: Clippy (warnings are errors)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Format check
        run: cargo fmt --all --check

      # Two spellings silently drop a state update when a mutex is poisoned
      # (18.6.7): `if let Ok(..) = X.lock()` and `.lock().map(..)`. Neither is
      # ever legitimate — tests only ever take a raw lock to poison one on
      # purpose. Grep, not a lint: no tooling, and it names the line.
      - name: Lock convention
        run: |
          hits=$(grep -rnE 'if let Ok\(.*\.lock\(\)|let Ok\(.*\.lock\(\)|\.lock\(\)\.map\(' src/ || true)
          if [ -n "$hits" ]; then
            echo "use crate::lock_or_recover() instead of a fallible lock:"; echo "$hits"; exit 1
          fi
          echo "lock-convention: ok"
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      # deny.toml is the policy: permissive licence allow-list, no wildcards or
      # git sources, and advisories blocking (4 unmaintained IDs are ignored
      # there with a reason, because no patched release exists).
      - name: Licences + advisories (cargo-deny)
        run: cargo deny --all-features check licenses advisories bans sources

  # Runs the suite 20x to catch the order-dependent, timing-sensitive tests that
  # a single green run cannot see. One test passed on every push and failed in
  # the wild because it read a state a few microseconds before it settled (PR
  # #65); that class only shows up under repetition.
  #
  # Deliberately NOT part of the required `build + test + clippy` check: a flaky
  # test should be visible and fail this job, not block every merge on a rerun.
  flake-check:
    name: flake check (20x)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system deps (egui/winit)
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libasound2-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxcb1-dev libssl-dev pkg-config

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Build once; the 20 passes below then only run the binaries. `cargo test`
      # still checks freshness, which costs nothing after this warmed the tree.
      - name: Build tests
        run: cargo test --all-targets --no-run

      - name: Run the suite 20x
        run: |
          for i in $(seq 1 20); do
            printf '::group::run %s/20\n' "$i"
            if ! cargo test --all-targets; then
              echo "::error::test suite failed on run $i of 20 — investigate as a flake"
              exit 1
            fi
            echo '::endgroup::'
          done
          echo "flake check: 20/20 clean"

  # The Windows claim is proven by .github/workflows/windows-native.yml, which
  # builds natively on a Windows runner and asserts a window appears. The mingw
  # cross-compile job that used to live here added no signal on top of that (it
  # only proved the code links), and its apt step wedged for 18+ minutes
  # repeatedly, so it is gone. Dispatch windows-native before a release or when
  # platform-specific code changes.
