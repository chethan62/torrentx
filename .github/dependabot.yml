version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    # No `ignore` rules are needed: the tray uses tray-icon's `ksni` backend, so
    # the gtk and glib families (gtk, gtk-sys, glib, atk, gdk, gio, pango, cairo)
    # are not in the dependency graph at all. Re-enabling the `libappindicator`
    # backend brings gtk 0.18 back, and its bump is unresolvable then (gtk-sys
    # 0.18 and 0.19 both declare links = "gtk-3"); git history has the ignore
    # rules and the reachability trace that were needed while it was in use.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
