# cargo-deny policy. Scope is deliberately narrow: licences and advisories are
# blocking; duplicate-version noise is not.
#
# Allow-list = the permissive set this dependency tree actually resolves to
# (`cargo metadata | .packages[].license`). Anything copyleft must come through
# a review, not an allow entry.
[advisories]
# Four crates are unmaintained upstream with no patched release: ttf-parser
# (via egui -> owned_ttf_parser) and zbus_names / zvariant / zvariant_derive
# (via accesskit -> atspi). Denying would only force pinning old egui, so warn
# here and revisit at the next egui/accesskit bump.
unmaintained = "all"
# Accepted: no patched release exists for these four. Bumping egui/accesskit is
# the only real fix (tracked as a known area in the README/CHANGELOG).
ignore = [
    "RUSTSEC-2026-0192", # ttf-parser (egui -> owned_ttf_parser)
    "RUSTSEC-2026-0370", # zvariant (accesskit -> atspi)
    "RUSTSEC-2026-0371", # zbus_names
    "RUSTSEC-2026-0372", # zvariant_derive
]
yanked = "deny"

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "BSL-1.0",
    "Unicode-3.0",
    "CC0-1.0",
    "Unlicense",
    "0BSD",
    # Embedded Noto CJK subsets (assets/NotoSansCJKjp-subset.*, see README).
    "OFL-1.1",
    "Ubuntu-font-1.0",
    # CA root certificates shipped by webpki-root-certs.
    "CDLA-Permissive-2.0",
]

[bans]
# No `*` or git dependencies: every crate must be a pinned crates.io version.
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
